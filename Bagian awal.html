<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas KKA</title>
  <style>
    /* Reset & Base Style */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body { 
      font-family: Arial, sans-serif;
      background-color: #0F172A; /* Slate Gelap */
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .main-title {
      color: #F8FAFC;
      text-align: center;
      font-size: clamp(32px, 6vw, 50px);
      margin-bottom: 25px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .judul {
      background-color: #1E293B;
      border: 2px solid #334155;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .semester-title {
      color: #38BDF8; /* Biru Cerah */
      font-size: clamp(22px, 4vw, 28px);
      margin: 10px 0 15px 5px;
    }

    .subjudul {
      background-color: #0F172A;
      border: 2px solid #334155;
      border-radius: 25px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .item-list {
      list-style: none;
    }

    .item-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #F8FAFC;
      font-size: clamp(16px, 3.5vw, 20px);
      font-weight: bold;
      padding: 12px 18px;
      margin-bottom: 10px;
      border-radius: 12px;
      background-color: #1E293B;
      transition: background-color 0.2s ease;
    }

    .item-list li:hover {
      background-color: #334155;
    }

    /* Base Styling untuk Semua Tombol Link */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-materi {
      background-color: #38BDF8;
      color: #0F172A;
      font-size: clamp(12px, 2.5vw, 15px);
      padding: 8px 18px;
      border-radius: 20px;
    }

    .btn-container {
      text-align: left;
      margin-top: 20px;
      padding-top: 10px;
    }

    .btn-tugas {
      background-color: #6366F1; /* Indigo */
      color: #FFFFFF;
      font-size: clamp(16px, 3.5vw, 22px);
      padding: 12px 28px;
      border-radius: 50px;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    .btn-tugas:hover {
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.6);
    }
  </style>
</head>
<body>

  <main class="container">
    <h1 class="main-title">Tugas KKA</h1>
    
    <div class="judul">
      
      <!-- Semester 1 -->
      <section>
        <h2 class="semester-title">Semester 1:</h2>
        <div class="subjudul">
          <ul class="item-list">
            <li>
              <span>Biodata Lama</span>
              <a href="Biodata lama.html" class="btn btn-materi">Next &rarr;</a>
            </li>
            <li>
              <span>Hewan Ovovivipar</span>
              <a href="Hewan Ovovivipar.html" class="btn btn-materi">Next &rarr;</a>
            </li>
            <li>
              <span>Mobil Koenigsegg</span>
              <a href="Mobil Koenigsegg.html" class="btn btn-materi">Next &rarr;</a>
            </li>
          </ul>
          
          <div class="btn-container">
            <a href="Biodata lama.html" class="btn btn-tugas">Tugas 1 &rarr;</a>
          </div>
        </div>
      </section>

      <!-- Semester 2 -->
      <section>
        <h2 class="semester-title">Semester 2:</h2>
        <div class="subjudul">
          <ul class="item-list">
            <li>
              <span>Biodata Baru</span>
              <a href="Biodata Baru.html" class="btn btn-materi">Next &rarr;</a>
            </li>
            <li>
              <span>Sepatu New Balance</span>
              <a href="Sepatu.html" class="btn btn-materi">Next &rarr;</a>
            </li>
            <li>
              <span>Dinosaurus Mosasaurus</span>
              <a href="Dino.html" class="btn btn-materi">Next &rarr;</a>
            </li>
            <li>
              <span>Kakashi Hatake</span>
              <a href="Anime.html" class="btn btn-materi">Next &rarr;</a>
            </li>
          </ul>
          
          <div class="btn-container">
            <a href="Biodata Baru.html" class="btn btn-tugas">Tugas 2 &rarr;</a>
          </div>
        </div>
      </section>

    </div>
  </main>

</body>
</html>
